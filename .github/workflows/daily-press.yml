name: Daily Press — The Daily Circuit

on:
  schedule:
    # Runs everyday at 00:30 UTC = 06:00 AM IST
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  press-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Compile 8-Page Daily Edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline/publish.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and Build Frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Commit and push new edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/editions/
          TODAY=$(date -u +"%Y-%m-%d")
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "press(edition): publish daily circuit for $TODAY [skip ci]"
            git push
          fi
