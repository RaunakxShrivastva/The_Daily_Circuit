<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="inkBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242836"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Archival Newspaper Badge Frame -->
  <circle cx="50" cy="50" r="48" fill="url(#inkBg)" stroke="#d9cfbe" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#2b241c" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Antenna & Fountain Pen Ink Nib -->
  <line x1="50" y1="36" x2="50" y2="18" stroke="#8e92a8" stroke-width="3" stroke-linecap="round"/>
  <!-- Fountain pen nib tip -->
  <path d="M50 7 L57 18 L50 22 L43 18 Z" fill="#10b981" stroke="#047857" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="1.5" fill="#ffffff"/>

  <!-- Robot Head / Body -->
  <rect x="22" y="32" width="56" height="52" rx="20" fill="url(#bodyGrad)" stroke="#3e4354" stroke-width="2"/>

  <!-- Glossy Screen Face -->
  <rect x="27" y="38" width="46" height="36" rx="14" fill="url(#screenGrad)" stroke="#1a1c26" stroke-width="1.5"/>

  <!-- Expressive Friendly Eyes -->
  <ellipse cx="40" cy="55" rx="5.5" ry="7.5" fill="#ffffff" filter="url(#glow)"/>
  <ellipse cx="60" cy="55" rx="5.5" ry="7.5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Eye Sparkles (Highlights) -->
  <circle cx="42" cy="52" r="2.2" fill="#38bdf8"/>
  <circle cx="62" cy="52" r="2.2" fill="#38bdf8"/>
  <circle cx="39" cy="57" r="1" fill="#ffffff"/>
  <circle cx="59" cy="57" r="1" fill="#ffffff"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="33" cy="65" rx="3.5" ry="1.8" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="67" cy="65" rx="3.5" ry="1.8" fill="#f43f5e" opacity="0.45"/>

  <!-- Small Happy Smile -->
  <path d="M46 66 Q50 69 54 66" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round"/>
</svg>
