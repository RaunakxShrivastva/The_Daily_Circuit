<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120400" />
    <title>The Daily Circuit — AI News, In Context</title>
    <meta name="description" content="The Daily Circuit covers artificial intelligence, science, technology and the future. Rigorous journalism on the stories that matter." />
    <meta property="og:title" content="The Daily Circuit — AI News, In Context" />
    <meta property="og:description" content="Artificial intelligence · science · technology · the future." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="video" href="/hero-loop.mp4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              desk: '#181715',
              bar: '#141311',
              cover: '#211f1c',
              paper: '#f4efe6',
              paperDeep: '#ebe3d5',
              ink: '#141413',
              muted: '#524f49',
              vermilion: '#c83e2b',
            },
            fontFamily: {
              display: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Botpress AI Integration (Inky the Press-Bot Brain) -->
    <link rel="stylesheet" href="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.css" />
    <script src="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        fetch('https://vdk-viber-runtime-prod.bot.botpress.host/edge/bots/dd58d352-864d-424a-91b4-b4d33fdee487/config')
          .then((res) => res.json())
          .then(({ webchat }) => {
            if (window.VdkEdgeWebchat) {
              window.botpressWebChat = window.VdkEdgeWebchat.mount({
                ...webchat,
                node: 'bubble',
                baseUrl: 'https://vdk-viber-runtime-prod.bot.botpress.host',
                botId: 'dd58d352-864d-424a-91b4-b4d33fdee487',
                botName: 'Inky the Press-Bot',
                avatarUrl: '/inky-avatar.svg',
                botAvatarUrl: '/inky-avatar.svg',
                agentAvatarUrl: '/inky-avatar.svg',
                description: 'The Daily Circuit’s living newsroom guide. Trained on today’s edition.',
                welcomeMessage: 'Inkling of a question? Ask Inky anything about today’s edition!',
                disclaimerText: 'You’re chatting with Inky, The Newsroom Mascot.',
                starters: [
                  "🗞️ What's today's lead headline?",
                  "⚡ Explain the 501B Beam MoE model",
                  "📦 How does print delivery work?",
                  "🔍 Search latest Arxiv breakthroughs"
                ],
                theme: 'auto',
                color: '#10b981',
                strings: {
                  welcomeMessage: 'Inkling of a question? Ask Inky anything about today’s edition!',
                  disclaimerText: 'You’re chatting with Inky, The Newsroom Mascot.',
                  askBot: 'Ask Inky the Press-Bot',
                  placeholder: 'Ask Inky about the daily news...'
                }
              });
            }
          })
          .catch((err) => console.warn('Botpress Webchat init notice:', err));

        // Observer to replace disclaimer text with "You're chatting with Inky" & track chat clicks
        const observer = new MutationObserver(() => {
          // Replace AI agent disclaimer text
          document.querySelectorAll('.vdk-edge, [data-renderer="published"]').forEach((container) => {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            let node;
            while ((node = walker.nextNode())) {
              if (node.nodeValue && /chatting with an ai agent/i.test(node.nodeValue)) {
                node.nodeValue = "You’re chatting with Inky, The Newsroom Mascot.";
              }
            }
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Listen for launcher button clicks to notify Inky Mascot
        document.addEventListener('click', (e) => {
          const target = e.target;
          if (target && target.closest && target.closest('.vdk-edge-launcher, .vdk-edge-bubble, [data-testid*="launcher"], button[aria-label*="chat" i]')) {
            window.dispatchEvent(new CustomEvent('daily-circuit:chat-opened'));
          }
        }, true);
      });
    </script>
  </body>
</html>
